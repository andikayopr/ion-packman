; Katalog global entri Registry/INI yang melekat di config mesin ATM. Didefinisikan sekali di sini, berlaku untuk semua Profile.
; Profile hanya mengaktifkan fitur (WindWebUI / JnlLog) yang menentukan entri mana yang berlaku ("Feature=" kosong = selalu).
; Setiap entri tetap harus lolos allowlist.ini. Dikelola developer ION; tidak bisa diubah dari UI.
[Meta]
SchemaVersion=1.0

[Registry:WebUISupport]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\WebUI
ValueName=Support
Type=DWORD
Value=1
Feature=WindWebUI

[Registry:LocalScreenDisplayFlag]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\Online_OPL\Welcome\LocalScreen
ValueName=DisplayFlag
Type=DWORD
Value=1
Feature=WindWebUI

[Ini:WebSocketSupport]
File=D:\APCONTAINER\Config\GPFCNFG.ini
Section=WebSocket
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUISupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=WebUI
Key=Support
Value=1
Feature=WindWebUI

[Ini:SettingSupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Setting
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUIJnlLog]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Debug
Key=JNLLog
Value=1
Feature=JnlLog
