; Profile MDD (prototype). Dependency mdd-service mengikuti keputusan D2 (ion-middleware, wind, non-ndc-parser).
; Fitur WIND WebUI mati di profile ini, jadi entri di bawah berstatus "Not applied".
[Meta]
SchemaVersion=1.0

[Profile]
Id=MDD
DisplayName=MDD
Version=1.0.0
DeploymentMode=in-place

[Features]
WindWebUI=false
JnlLog=false

[Component:ion-middleware]
Version=1.8.2
DependsOn=

[Component:wind]
Version=2.1.0
DependsOn=ion-middleware

[Component:non-ndc-parser]
Version=1.4.1
DependsOn=ion-middleware

[Component:mdd-service]
Version=2.4.0
DependsOn=ion-middleware,wind,non-ndc-parser

[Registry:WebUISupport]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\WebUI
ValueName=Support
Type=DWORD
Value=1
Feature=WindWebUI

[Registry:LocalScreenDisplayFlag]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\Online_OPL\Welcome\LocalScreen
ValueName=DisplayFlag
Type=DWORD
Value=1
Feature=WindWebUI

[Ini:WebSocketSupport]
File=D:\APCONTAINER\Config\GPFCNFG.ini
Section=WebSocket
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUISupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=WebUI
Key=Support
Value=1
Feature=WindWebUI

[Ini:SettingSupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Setting
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUIJnlLog]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Debug
Key=JNLLog
Value=1
Feature=JnlLog
