; Profile QRIS TAP (prototype). Entri Registry/INI dideklarasikan sekali di sini (D1).
[Meta]
SchemaVersion=1.0

[Profile]
Id=QRISTAP
DisplayName=QRIS TAP
Version=1.0.0
DeploymentMode=in-place

[Features]
WindWebUI=true
JnlLog=true                    ; hanya berlaku jika WindWebUI=true

[Component:ion-middleware]
Version=1.8.2
DependsOn=

[Component:wind]
Version=2.1.0
DependsOn=ion-middleware

[Component:qraptor]
Version=1.3.1
DependsOn=ion-middleware

[Registry:WebUISupport]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\WebUI
ValueName=Support
Type=DWORD
Value=1
Feature=WindWebUI

[Registry:LocalScreenDisplayFlag]
Key=HKLM\SOFTWARE\WOW6432Node\HitachiExternalParameter\User\Online_OPL\Welcome\LocalScreen
ValueName=DisplayFlag
Type=DWORD
Value=1
Feature=WindWebUI

[Ini:WebSocketSupport]
File=D:\APCONTAINER\Config\GPFCNFG.ini
Section=WebSocket
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUISupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=WebUI
Key=Support
Value=1
Feature=WindWebUI

[Ini:SettingSupport]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Setting
Key=Support
Value=1
Feature=WindWebUI

[Ini:WebUIJnlLog]
File=D:\APCONTAINER\Config\WebUIUXCNFG.ini
Section=Debug
Key=JNLLog
Value=1
Feature=JnlLog
